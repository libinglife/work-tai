# Nginx 示例：将构建产物放到 /var/www/work-tai
#
# 用法：复制为站点配置后改 server_name，再 sudo ln -s 到 sites-enabled 并重载 nginx。
# 若使用 HTTPS，建议用 certbot：sudo certbot --nginx -d your-domain.com

server {
    listen 80;
    listen [::]:80;
    server_name _;  # 改成你的域名，如 desk.example.com

    root /var/www/work-tai;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # B 站搜索代理（浏览器请求 /bili-api/...）
    location /bili-api/ {
        proxy_pass https://api.bilibili.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.bilibili.com;
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; work-tai/1.0)";
    }

    # 静态资源缓存（Vite 带 hash 的文件名可长期缓存）
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/work-tai.access.log;
    error_log  /var/log/nginx/work-tai.error.log;
}
